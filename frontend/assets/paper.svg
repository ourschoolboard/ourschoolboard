<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <filter id="p" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.011" numOctaves="4" seed="14" stitchTiles="stitch" result="cloud"/>
    <feColorMatrix in="cloud" type="saturate" values="0" result="gray"/>
    <feComponentTransfer in="gray" result="soft">
      <feFuncR type="linear" slope="0.10" intercept="0.90"/>
      <feFuncG type="linear" slope="0.10" intercept="0.895"/>
      <feFuncB type="linear" slope="0.11" intercept="0.88"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3" stitchTiles="stitch" result="fib"/>
    <feColorMatrix in="fib" type="saturate" values="0" result="fibg"/>
    <feComponentTransfer in="fibg" result="fibs">
      <feFuncR type="linear" slope="0.05" intercept="0.955"/>
      <feFuncG type="linear" slope="0.05" intercept="0.955"/>
      <feFuncB type="linear" slope="0.05" intercept="0.95"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feBlend in="soft" in2="fibs" mode="multiply"/>
  </filter>
  <rect width="600" height="600" filter="url(#p)"/>
</svg>
